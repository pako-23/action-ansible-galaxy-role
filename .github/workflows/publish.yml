name: Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  actions: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all required workflow runs passed
        id: check
        run: |
          FAILED=$(gh run list \
            --commit "${{ github.sha }}" \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$FAILED" -gt 0 ]; then
            echo "Required workflow runs did not pass for this commit."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find check-dist run ID
        id: find
        run: |
          RUN_ID="$(gh run list \
            --workflow check-dist.yml \
            --commit "${{ github.sha }}" \
            --json databaseId --jq '.[0].databaseId')"
          echo "run-id=${RUN_ID:-none}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist artifact
        if: steps.find.outputs.run-id != 'none'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find.outputs.run-id }}

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Update major version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAJOR="$(echo '${{ github.ref_name }}' | cut -f1 -d '.')"
          git tag -f "$MAJOR" '${{ github.ref_name }}'
          git push origin --tags --force
